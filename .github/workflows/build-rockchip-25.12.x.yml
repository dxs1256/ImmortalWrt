name: Build 25.12.x Rockchip
# 目前此工作流可以集成imm仓库内的软件 第三方软件暂不能集成(待开发)
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        type: choice
        description: |
          输入 软路由型号 可选值如下：
        options:
          - friendlyarm_nanopi-r4s
        required: true
        default: 'friendlyarm_nanopi-r4s'
      custom_router_ip:
        description: "请设置软路由的管理地址(注意仅对多网口软路由有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      rootfs_partsize:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '3G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
        default: "071900263467"
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false
        default: "123456"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build25.sh
      
      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的Rockchip软路由管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      # docker 引擎(docker/dockerd)已在 rockchip/build25.sh 的 INCLUDE_DOCKER=yes 分支处理，
      # 无需在此追加 apk-custom-packages.sh（那是 24.10/opkg 用的，对 25.12/apk 无效）

      - name: Enable Pushbot integration
        run: |
          mkdir -p "${{ github.workspace }}/shell/pushbot"
          curl -sL -o "${{ github.workspace }}/shell/pushbot/pushbot.apk" \
            "https://github.com/gaoyaxuan/luci-app-pushbot/releases/download/v3.8.20/luci-app-pushbot-3.8.20-r1_SNAPSHOT.apk"
          echo "✅ pushbot.apk 已下载到 shell/pushbot/"
          echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-pushbot bash curl jq smartmontools iputils-arping"' >> shell/apk-custom-packages.sh
          echo "✅ 已追加 pushbot"

      - name: Enable Accesscontrol integration
        run: |
          # 25.12 无 luci-app-accesscontrol 的 apk 包（官方源/第三方均为 ipk），
          # 这里用 files/ 覆层方式集成，插件可用但不显示在 Plugin-list
          mkdir -p files
          python3 << 'PYEOF'
          import tarfile, urllib.request, io, os

          BASE_URL = "https://github.com/aige168/luci-app-accesscontrol/archive/refs/heads/main.tar.gz"
          print("📥 下载 luci-app-accesscontrol...")
          resp = urllib.request.urlopen(BASE_URL)
          tar = tarfile.open(fileobj=io.BytesIO(resp.read()))

          PREFIX = "luci-app-accesscontrol-main/"
          for member in tar.getmembers():
              if not member.name.startswith(PREFIX):
                  continue
              rel = member.name[len(PREFIX):]
              if rel.startswith("luasrc/"):
                  member.name = "usr/lib/lua/luci/" + rel[len("luasrc/"):]
              elif rel.startswith("root/"):
                  member.name = rel[len("root/"):]
              elif rel.startswith("po/"):
                  member.name = "usr/lib/lua/luci/" + rel
              else:
                  continue
              if member.isfile() or member.islnk():
                  tar.extract(member, "files")
          print("✅ accesscontrol 已解压到 files/")
          PYEOF

      - name: Enable OpenList2
        run: |
          mkdir -p "${{ github.workspace }}/shell/openlist2"
          curl -sL "https://github.com/sbwml/luci-app-openlist2/releases/download/v4.2.5/openwrt-25.12-aarch64_cortex-a72.tar.gz" \
            | tar -xzf - -C "${{ github.workspace }}/shell/openlist2/" --strip-components=1
          echo "✅ openlist2 APK 已下载到 shell/openlist2/"
          echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-openlist2 luci-i18n-openlist2-zh-cn"' >> shell/apk-custom-packages.sh
          echo "✅ 已追加 openlist2"

      - name: Building Rockchip ImmortalWrt 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          case "$rootfs_partsize" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for profile: $profile"
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/rockchip/imm25.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/rockchip/build25.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$ROOTFS_SIZE \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
          immortalwrt/imagebuilder:rockchip-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
        
    
      - name: Generate package report
        run: |
          TARGET_DIR="${{ github.workspace }}/bin/targets/rockchip/armv8"
          PROFILE="${{ github.event.inputs.profile }}"
          MANIFEST_FILE=$(ls "$TARGET_DIR"/*"$PROFILE"*.manifest 2>/dev/null | head -n1)
          if [ -z "$MANIFEST_FILE" ]; then
            MANIFEST_FILE=$(ls "$TARGET_DIR"/*.manifest 2>/dev/null | head -n1)
          fi

          if [ -z "$MANIFEST_FILE" ]; then
            echo "未找到 manifest 文件，无法生成插件清单" >&2
            exit 1
          fi

          cp "$MANIFEST_FILE" "${{ github.workspace }}/firmware-packages.txt"
          grep -E '^(luci-app|luci-i18n|luci-theme)-' "$MANIFEST_FILE" > "${{ github.workspace }}/Plugin-list.txt" || true

          kernel_version=$(awk '/^kernel - / {print $3; exit}' "$MANIFEST_FILE")
          if [ -z "$kernel_version" ]; then
            kernel_version="unknown"
          fi

          kernel_version_short=$(echo "$kernel_version" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$kernel_version_short" ]; then
            kernel_version_short="$kernel_version"
          fi

          echo "KERNEL_VERSION=$kernel_version_short" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - ✳️ **软路由型号**: ${{ github.event.inputs.profile }}
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 📦 **固件版本**: ${{ github.event.inputs.luci_version }}
          - 🧠 **内核版本**: ${KERNEL_VERSION}
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            echo -e "\n- 🐳 **Docker**: 已集成" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n- 🐳 **Docker**: 未集成" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-25.12-${{ env.BUILD_DATE }}
          name: ImmortWrt-Rockchip-25.12
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
            ${{ github.workspace }}/Plugin-list.txt
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
